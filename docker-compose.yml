version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: chatbot_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin2026
      POSTGRES_DB: chatbot_admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: